name: UART CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["develop"]

jobs:
  branch-policy:
    name: Enforce develop to main policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Verify source branch
        run: |
          if [[ "${{ github.head_ref }}" != "develop" ]]; then
            echo "Only develop branch can be merged into main"
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

  docker-cocotb-regression:
    name: Docker cocotb regression
    runs-on: ubuntu-latest
    needs: branch-policy
    if: always() && (needs.branch-policy.result == 'success' || needs.branch-policy.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t uart-vhdl:ci .

      - name: Run UART regression
        run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace uart-vhdl:ci make cocotb-test

      - name: Upload cocotb XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: build/cocotb/**/results.xml
          if-no-files-found: warn
